# Publishes a release that installed copies of AntHill offer as an update.
# Run it by hand: GitHub > Actions > Release > Run workflow. Pick the branch
# or commit to ship and the part of the version to bump. Nothing publishes on push.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise (1.2.3 -> patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the next version
        run: |
          latest=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')
          latest=${latest#v}
          [[ -n "$latest" ]] || latest=0.0.0
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          if gh release view "v$version" >/dev/null 2>&1; then echo "v$version is already published"; exit 1; fi
          echo "Publishing $version (latest was $late
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build
        run: ./build.sh

      - name: Publish
        run: |
          zip="AntHill-$VERSION.zip"
          ditto -c -k --keepParent "$HOME/Applications/AntHill.app" "$zip"
          gh release create "v$VERSION" "$zip" --target "$GITHUB_SHA" --title "AntHill $VERSION" --generate-notes
